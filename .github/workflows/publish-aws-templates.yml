name: Publish AWS templates

# Uploads aws/node.yaml of a signed script release to the template bucket, where the
# CloudFormation quick-create link points:
#   s3://<vars.AWS_TEMPLATES_BUCKET>/templates/<scripts-vX.Y.Z>/node.yaml
# Runs on a scripts-vX.Y.Z tag on a commit of main, or by hand on such a tag (choose the tag
# as the ref, as for publish-installer.yml). The template passes cfn-lint, the cfn-guard rules
# and their tests first. The upload job runs in the GitHub environment aws-templates and
# assumes vars.AWS_TEMPLATES_ROLE_ARN (us-east-1) with its OIDC token. That role may only
# s3:PutObject under templates/*, so the job makes one PutObject call: it lists, deletes and
# sets ACLs on nothing.
on:
  push:
    tags: ['scripts-v*']
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: template checks
    # A manual run must also be started on a release tag.
    if: startsWith(github.ref, 'refs/tags/scripts-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: python -m pip install --require-hashes -r aws/requirements-ci.txt
      # The same pinned release and sha256 as the "cfn lint" job in ci.yml.
      - name: Install cfn-guard
        env:
          GUARD_VERSION: 3.2.2
          GUARD_SHA256: 65ce4d16c4cc26fac37176a7127ba3f36b5aef12e3afd9b847f7c1e8c3d823d7
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/cfn-guard.tar.gz" \
            "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${GUARD_VERSION}/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz"
          echo "${GUARD_SHA256}  $RUNNER_TEMP/cfn-guard.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cfn-guard"
          tar -xzf "$RUNNER_TEMP/cfn-guard.tar.gz" -C "$RUNNER_TEMP/cfn-guard" --strip-components=1
          echo "$RUNNER_TEMP/cfn-guard" >> "$GITHUB_PATH"
      - name: cfn-lint the template
        run: cfn-lint aws/node.yaml
      - name: cfn-guard rules on the template
        run: cfn-guard validate --rules aws/rules --data aws/node.yaml --show-summary fail
      - name: cfn-guard rule tests
        run: cfn-guard test --dir aws/rules

  upload:
    name: upload to S3
    needs: check
    if: startsWith(github.ref, 'refs/tags/scripts-v')
    runs-on: ubuntu-latest
    environment: aws-templates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TEMPLATES_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload node.yaml
        env:
          BUCKET: ${{ vars.AWS_TEMPLATES_BUCKET }}
          TAG: ${{ github.ref_name }}
        run: |
          aws s3api put-object --bucket "$BUCKET" --key "templates/${TAG}/node.yaml" \
            --body aws/node.yaml --content-type text/yaml
          echo "Uploaded s3://${BUCKET}/templates/${TAG}/node.yaml"
