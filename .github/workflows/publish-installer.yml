name: Publish installer

# Publishes install.sh to GitHub Pages (custom domain: install.telcoin.network)
# from a signed script release only: a scripts-vX.Y.Z tag on a commit of main
# whose MANIFEST matches the tree and whose MANIFEST.sig verifies against
# lib/allowed_signers. The served installer names that tag and carries the
# release signer list, and verifies the release itself before installing.
# The site root returns the installer body verbatim, so
# `curl --proto '=https' --tlsv1.2 -fsSL https://install.telcoin.network | bash` works.
on:
  push:
    tags: ['scripts-v*']
  workflow_dispatch:

permissions: {}

# Allow one concurrent Pages deploy; never cancel an in-flight one (a cancelled
# deploy can leave Pages in a half-updated state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run must also be started on a release tag.
    if: startsWith(github.ref, 'refs/tags/scripts-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: The release manifest matches the tree and its signature verifies
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/release-scripts.sh --check --tag "$TAG"
      - name: Assemble site
        run: |
          mkdir -p _site
          cp install.sh _site/index.html           # root URL returns the installer
          cp install.sh _site/install.sh            # /install.sh alias also works
          echo 'install.telcoin.network' > _site/CNAME   # keep the custom-domain binding on deploy
          touch _site/.nojekyll                      # skip Jekyll processing
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/scripts-v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
