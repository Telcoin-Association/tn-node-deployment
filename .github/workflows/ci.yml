name: CI

# Operators install and update these scripts from signed releases (a
# scripts-vX.Y.Z tag whose MANIFEST.asc holds good OpenPGP signatures over
# MANIFEST by the release keys in lib/release-keys).
# These gates keep main releasable and check every release change.
#
# Every action is pinned to a full commit SHA with its tag in a comment
# (Dependabot proposes updates). The workflow token gets no permissions by
# default; each job asks for read access to the contents only.
on:
  push:
    branches: [main]
    tags: ['scripts-v*']
  pull_request:

permissions: {}

jobs:
  parse-linux:
    name: bash -n (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A parse error in a release bricks the installer and the updater. This is
      # the single most important check, and it is zero-false-positive.
      - name: Parse-check every shell script
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fail=1; fi
          done < <(git ls-files '*.sh')
          exit "$fail"
      # The lint runs here as well as on macOS because Ubuntu's awk is mawk and
      # macOS's is BSD awk; the tool must give the same answer under both.
      - name: bash-3.2 lint (mawk)
        run: git ls-files -z '*.sh' | xargs -0 bash tools/check-bash32.sh

  parse-macos:
    name: bash -n and bash-3.2 lint (macOS bash 3.2)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS ships bash 3.2 as /bin/bash and some operators run observers there.
      # `bash -n` only catches syntax that 3.2 cannot parse (&>>, |&, ;;&, coproc).
      # Constructs that parse but fail at run time (declare -A, local -n, ${x,,},
      # mapfile, ...) are caught by tools/check-bash32.sh, run under /bin/bash so
      # the lint itself is proven 3.2-clean. Invoke /bin/bash explicitly so this
      # tests 3.2 regardless of what is on PATH.
      - name: Show system bash version
        run: /bin/bash --version | head -1
      - name: Parse-check every shell script under bash 3.2
        run: |
          fail=0
          while IFS= read -r f; do
            if /bin/bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fail=1; fi
          done < <(git ls-files '*.sh')
          exit "$fail"
      - name: bash-3.2 lint (BSD awk)
        run: git ls-files -z '*.sh' | xargs -0 /bin/bash tools/check-bash32.sh
      # The UI's shell tests are pure bash and must pass under 3.2 too. As a
      # user (not root), install_ui_test.sh checks only that the installer
      # refuses to run; its ownership and mode cases need root.
      - name: UI helper tests under bash 3.2
        run: /bin/bash ui/tests/helper_test.sh
      - name: UI installer tests under bash 3.2
        run: /bin/bash ui/tests/install_ui_test.sh
      - name: open-ui.sh tests under bash 3.2
        run: /bin/bash ui/tests/open_ui_test.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest  # shellcheck is preinstalled on ubuntu runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocking: real errors only. -x resolves sourced lib/*.sh.
      - name: shellcheck (errors -- blocking)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x --severity=error
      # Advisory: style nits surfaced but not blocking on day one.
      - name: shellcheck (warnings -- advisory)
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x --severity=warning

  fixture-tests:
    name: fixture tests (Linux bash 5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools/tests under bash 5
        run: bash tools/tests/run.sh

  fixture-tests-macos:
    name: fixture tests (macOS bash 3.2)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools/tests under /bin/bash 3.2
        run: /bin/bash tools/tests/run.sh

  hardening-lint:
    name: hardening lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No script may print a passphrase variable. The rule and its exceptions
      # (a value piped into a command's standard input, comments) are in the test.
      - name: Passphrase-print lint
        run: bash tools/tests/passphrase_print_test.sh
      # No perl program may expand a shell variable inside its code.
      - name: perl interpolation lint
        run: git ls-files -z '*.sh' | xargs -0 bash tools/check-perl-interp.sh
      # Every scanned line that names the testnet (adiri, the add-on hub hosts
      # and addresses) must carry a `network-gated:` comment that says why it
      # is safe on mainnet. The scanned files and the marker rules are in the
      # tool's header.
      - name: network hits
        run: bash tools/check-network-hits.sh

  manifest:
    name: release manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A release change (MANIFEST, MANIFEST.asc or RELEASE touched) and a
      # scripts-v* tag must carry a MANIFEST that matches the tree and a
      # MANIFEST.asc that verifies with gpgv (preinstalled on the runner)
      # against lib/release-keys. Other changes leave the previous release's
      # MANIFEST in place, so it is not compared.
      - name: Check the release manifest
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$REF" in
            refs/tags/scripts-v*)
              bash tools/release-scripts.sh --check --tag "$REF_NAME"
              exit $?
              ;;
          esac
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No base commit to compare with; MANIFEST check skipped."
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qxE 'MANIFEST|MANIFEST\.asc|RELEASE'; then
            bash tools/release-scripts.sh --check --require-sig
          else
            echo "Not a release change: MANIFEST is not compared with the tree."
          fi

  ui-tests:
    name: Node Manager UI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.10 is the oldest interpreter the UI supports (Ubuntu 22.04).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      # The same hash-pinned set the UI installer uses; pip refuses any package
      # whose hash is not in the file.
      - name: Install the UI's pinned dependencies
        run: |
          python -m pip install --require-hashes -r ui/requirements.txt
          python -m pip install --require-hashes -r ui/tests/requirements-dev.txt
      # No network, no sudo: the tests stub the privileged helper and the node.
      - name: Server contract, chain logic and public read-only tests
        run: python -m pytest -q ui
      - name: UI helper tests under bash 5
        run: bash ui/tests/helper_test.sh
      - name: UI installer tests under bash 5
        run: bash ui/tests/install_ui_test.sh
      - name: open-ui.sh tests under bash 5
        run: bash ui/tests/open_ui_test.sh

  checksums:
    name: checksum freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Updaters older than the signed-manifest flow still verify each file
      # against its .sha256 sidecar, and a host's first signed release fetches
      # the release keys (lib/release-keys/*.asc) through theirs, so the
      # sidecars stay fresh. Regenerate
      # them and fail if anything changed. `git status --porcelain` (not
      # `git diff`) also catches new untracked sidecars.
      - name: Regenerate sidecars and verify they are committed & fresh
        run: |
          bash tools/gen-checksums.sh
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::SHA-256 sidecars are stale or missing. Run 'bash tools/gen-checksums.sh' and commit the result."
            git --no-pager status
            git --no-pager diff
            exit 1
          fi
          echo "All sidecars are fresh and committed."
