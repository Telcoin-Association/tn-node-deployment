# Cover and PDF metadata for docs/partner/technical-specification/technical-specification.md.
# The title is NOT set here: it comes from the document's single "# " heading.
# Bump `version` and `date` whenever the content changes. `date` is printed on the
# cover and in the running footer as written and names the month only ("November 2026",
# never a day). pandoc cannot normalise a month-only date, so `date-meta` stays unset,
# the template emits no dcterms tags and the PDF carries no creation date; that keeps
# the build byte-reproducible.
# The cover prints `cover-title` as its large line and `subtitle` beneath it, as the
# original does; the document title (the Markdown "# " heading) runs the header and TOC.
